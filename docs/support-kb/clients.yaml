# Verified client-app knowledge for the support assistant.
#
# Rule: the assistant may name a screen, button or setting only if it is listed
# here with status: verified for that app, platform and state. Anything else is
# "unverified" and must not be given to a client as an instruction.
#
# Every verified entry carries the app version, the date, who checked it and
# evidence (a screenshot under docs/support-kb/evidence/ or a live-run note).
# Labels are copied exactly as the app shows them, in the UI language noted.
# The interface differs between the disconnected and connected states, so each
# screen records the state it was read in.
#
# App list per platform comes from the panel's subscription page config
# (Default, /api/subscription-page-configs/00000000-0000-0000-0000-000000000000).

apps:
  - app: Clash Mi
    platform: macos
    version: "1.0.22"
    ui_language: en
    verified_at: "2026-11-07"
    verified_by: live read on the owner's Mac (computer-use, no connection made)
    evidence: docs/support-kb/evidence/clashmi-macos-1.0.22/
    states:
      disconnected:
        status: verified
        screens:
          main:
            items: ["Disconnected (toggle on the right)", "Rule", "Global", "Direct",
                    "My Profiles (+ and >)", "App Settings", "Core Settings", "Core Log",
                    "Backup and Sync", "Help", "About"]
            evidence: 01-main-disconnected.jpg
          my_profiles:
            path: main → My Profiles ">"
            items: ["cloud with arrow (top right): update all profiles", "+ (top right): add profile",
                    "⋮ next to a profile: profile menu"]
            evidence: 02-my-profiles.jpg
          add_profile_sheet:
            path: My Profiles → "+"
            items: ["Get Profile / Buy Profile", "Add Profile Link", "Import From Clipboard",
                    "Scan QR Code", "Import Profile File"]
            evidence: 03-add-profile-sheet.jpg
          profile_menu:
            path: My Profiles → "⋮" next to the profile
            items: ["View", "Update", "Copy Link", "QR Code", "Profile Edit", "Remove"]
            evidence: 04-profile-menu.jpg
          app_settings:
            path: main → App Settings
            items: ["Reset", "Language", "Theme", "Auto Update Channel", "Auto Download Update Packages",
                    "UserAgent", "Delay Test URL", "Delay Test Timeout(ms)", "Use Online Board",
                    "Local Board Port", "Auto Connection after Launch",
                    "Auto Set System Proxy when Connected",
                    "Domain names that are allowed to bypass the system", "Hide Dock Icon"]
            evidence: [05-app-settings.jpg, 06-app-settings-bottom.jpg]
          core_settings:
            path: main → Core Settings
            items: ["Reset", "External Controller", "Secret", "Mixed Proxy Port", "Log Level",
                    "Find Process Mode", "IPv6", "TUN", "Geo RuleSet", "Diversion Template",
                    "Overwrite", "TLS Global Fingerprint", "LAN device access"]
            evidence: 07-core-settings.jpg
          tun:
            path: main → Core Settings → TUN
            items: ["Overwrite", "Enable", "IPv4 Gateway Address", "Network stack", "DNS Hijack",
                    "Strict Route", "Default Route", "ICMP Forwarding"]
            evidence: 08-tun.jpg
        tasks:
          add_subscription: 'My Profiles → "+" → "Import From Clipboard" (link copied first) or "Add Profile Link"'
          update_subscription: 'My Profiles → cloud-with-arrow icon (all), or "⋮" → "Update" (one profile)'
          share_subscription: 'My Profiles → "⋮" → "QR Code" or "Copy Link"'
          mode: 'main screen: "Rule" (default, RU sites direct), "Global" (everything via VPN), "Direct"'
      connected:
        status: verified
        evidence_dir: docs/support-kb/evidence/clashmi-macos-1.0.22-ru/
        note: read in the Russian UI; the connected main screen gains blocks that are absent when disconnected
        screens:
          main:
            items_ru: ["Подключено (тумблер справа, зелёный)", "счётчики трафика и скорости под статусом",
                       "Правила", "Глобально", "Напрямую", "Профили (+ и >)",
                       "Прокси (текущая группа, например «Остальные сайты -> Зарубежные серверы (баланс)», и >)",
                       "Панель", "Конфигурация времени в…", "Проверка сети"]
            evidence: 08-main-connected.jpg
          proxies:
            path_ru: главный экран → Прокси ">"
            items_ru: ["список групп: Остальные сайты, TikTok (чистые форин), TikTok, Недоступные из РФ, Торрент-трекеры, YouTube, Telegram, Instagram…",
                       "у группы тип (Selector/URLTest/Fallback), задержка и выбранный сервер справа", "сортировка и молния (тест задержки) вверху"]
            evidence: 09-proxies-connected.jpg
          network_check:
            path_ru: главный экран → Проверка сети
            items_ru: ["Домен", "Проверить", "1. DNS-запрос", "2. HTTP (через TUN, сначала включите TUN)",
                       "3. HTTP (через прокси, порт: 7890)", "4. Таблица маршрутов"]
            evidence: 10-network-check.jpg
        tasks:
          choose_server: 'главный экран → Прокси → группа (например «Остальные сайты») → сервер'
          self_check: 'главный экран → Проверка сети → домен → Проверить (только при подключении)'
    russian_ui:
      status: verified
      evidence_dir: docs/support-kb/evidence/clashmi-macos-1.0.22-ru/
      how_to_switch: 'App Settings → Language → Русский (в русском: Настройки приложения → Язык)'
      partial_translation: 'заголовок экрана настроек приложения остаётся «App Settings»; Pprof, Geo RuleSet, TUN, UserAgent не переведены'
      labels_en_ru:
        Disconnected: Отключено
        Connected: Подключено
        Rule: Правила
        Global: Глобально
        Direct: Напрямую
        My Profiles: Профили
        App Settings: Настройки приложения
        Core Settings: Настройки ядра
        Core Log: Журнал ядра
        Backup and Sync: Резервное копирование и синхронизация
        Help: Помощь
        Get Profile / Buy Profile: Получить профиль / Купить профиль
        Add Profile Link: Добавление подписки
        Import From Clipboard: Импорт из буфера обмена
        Scan QR Code: Сканировать QR-код
        Import Profile File: Импорт файла конфигурации
        View: Просмотр
        Update: Обновить
        Copy Link: Скопировать ссылку
        QR Code: QR-код
        Profile Edit: Редактирование профилей
        Remove: Удалить
        Language: Язык
        Auto Set System Proxy when Connected: Установить системный прокси после подключения
        Auto Connection after Launch: Автоматическое подключение после запуска
        Reset: Перезагрузить
        Diversion Template: Шаблон сортировки пациентов   # sic, mistranslation in the app
        Overwrite: Переопределить
        "TUN → Enable": Включить
        "TUN → DNS Hijack": Перехват DNS
        "TUN → Strict Route": Строгая маршрутизация
        "TUN → Default Route": Маршрут по умолчанию
        Proxies: Прокси
        Network check: Проверка сети
      corrections_to_old_kb: 'в kb.md было «Мои профили» — в русском интерфейсе раздел называется «Профили»'

  # Listed on the subscription page, not checked yet.
