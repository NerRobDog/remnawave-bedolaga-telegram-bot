          update_subscription: 'My Profiles → cloud-with-arrow icon (all), or "⋮" → "Update" (one profile)'
          share_subscription: 'My Profiles → "⋮" → "QR Code" or "Copy Link"'
          mode: 'main screen: "Rule" (default, RU sites direct). "Global" sends everything, RU sites too, through VPN to the server picked in Proxies → GLOBAL (servers only, first by default); use it to pick a specific server. "Direct" is no VPN.'
