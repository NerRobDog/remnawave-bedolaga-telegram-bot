# Verified client-app knowledge for the support assistant.
#
# Rule: the assistant may name a screen, button or setting only if it is listed
# here with status: verified for that app, platform and state. Anything else is
# "unverified" and must not be given to a client as an instruction.
#
# Every verified entry carries the app version, the date, who checked it and
# evidence (a screenshot under docs/support-kb/evidence/ or a live-run note).
# Labels are copied exactly as the app shows them, in the UI language noted.
# The interface differs between the disconnected and connected states, so each
# screen records the state it was read in.
#
# App list per platform comes from the panel's subscription page config
# (Default, /api/subscription-page-configs/00000000-0000-0000-0000-000000000000).

facts:
  # Cross-app facts confirmed on a live device. Rendered at the top of kb_clients.md.
  - text: 'Режим «Глобально» (Clash Mi) / «Глобальный» (FlClash(X)) — способ выбрать конкретный сервер: весь трафик, включая российские сайты, идёт через VPN на сервер, выбранный в Прокси → GLOBAL. В GLOBAL только серверы подписки, по умолчанию первый. Основной режим остаётся «Правила» / «По правилам»: там российские сайты идут напрямую. Если в GLOBAL выбран DIRECT или видны группы вместо серверов — подписка старая, нужно обновить подписку.'
    evidence: 'Своя группа GLOBAL выкачена в шаблоны Default и Abroad 2026-11-08 (Ansible_Servers PR #117, run 42424532556). Живые подписки ci_canary_mihomo_gate и abroad_test в mihomo: GLOBAL = только серверы, по умолчанию первый. Выбор сервера в GLOBAL проверен в Clash Mi 1.0.22 macOS на демо-профиле; на живой подписке подтверждён список в Clash Mi 1.0.31 на iPhone (2026-11-08: GLOBAL -> Germany-3, 4 сервера, без групп и DIRECT; выбор другого сервера там не нажимался); в FlClash(X) не проверялся. До выката GLOBAL = DIRECT (Clash Mi 1.0.31 и FlClashX 0.4.2 Android, 2026-11-07)'
  - text: 'Группа «Остальные сайты» предлагает выбрать не сервер, а пул: «Зарубежные серверы (баланс)» или «Обход блокировок РФ (авто)»; в FlClashX есть ещё «Напрямую» (DIRECT, без VPN, не советовать). Конкретную страну или сервер в ней не выбрать — для этого режим «Глобально».'
    evidence: 'Clash Mi 1.0.31 и FlClashX 0.4.2 на Android (Clash Mi ru-11, FlClashX ru-08) (2026-11-07)'
  - text: 'Каждое приложение на одном телефоне считается отдельным устройством. При превышении лимита приложение получает подписку с сервером-заглушкой «Слишком дофига устройств подключено к подписке»; Happ ещё пишет «Достигнут лимит подключённых устройств в подписке». Решение: удалить лишние устройства (мини-апп или кабинет → Подписка) и в приложении обновить подписку.'
    evidence: 'Galaxy A52, подписка с hwidDeviceLimit 1 (панель, /api/users/by-username): FlClashX получает полный конфиг (flclashx ru-07), Clash Mi (clashmi ru-12) и Happ (happ ru-01) на том же телефоне получают заглушку. Путь удаления устройств взят из kb.md, вживую не проверялся (2026-11-07)'

