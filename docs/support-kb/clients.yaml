  - app: FlClash
    platform: macos
    version: "0.9.3"
    ui_language: ru
    verified_at: "2026-11-07"
    verified_by: live read on the owner's Mac (connected, then stopped)
    evidence: docs/support-kb/evidence/flclash-macos-0.9.3-ru/
    note: 'FlClash upstream, not FlClashX from the subscription page; FlClashX is a fork, labels may differ'
    states:
      connected:
        status: verified
        screens:
          sidebar_ru: [Панель, Прокси, Профили, Запросы, Инструменты]
          panel_ru: ["Статус: Работает", "IP выхода и страна", "Время работы", "Организация", "кнопка пауза (остановить)",
                     "Отдача", "Загрузка", "Режим исходящего…: Правило / Глобальный / Прямой",
                     "Системный прокси (Порт 7890)", "TUN", "Внутренний IP", "Разрешить LAN", "Профиль (обновить ↻, >)",
                     "Состояние сети", "Память"]
          proxies_ru: "вкладки групп сверху (Остальные сайты, TikTok…), карточки серверов с задержкой; поиск, молния, ⋮"
        evidence: [01-panel-connected.jpg, 02-proxies-connected.jpg]
      disconnected:
        status: verified
        screens:
          panel_ru: ["Статус: Не запущено", "большая кнопка ▶ (запустить)", "IP — реальный, без VPN"]
        evidence: 06-panel-stopped.jpg
        note: 'при остановке системный прокси macOS снимается сам (проверено scutil --proxy)'
    tasks:
      add_subscription_ru: 'Профили → ⊕ (вверху справа) → Ссылка (или QR-код, Файл, Пользовательский)'
      update_subscription_ru: 'Профили → ↻ вверху (все) или Панель → Профиль → ↻'
      language_ru: 'Инструменты → Язык'
    evidence_more: [03-profiles.jpg, 04-profiles-add-menu.jpg, 05-tools.jpg]
