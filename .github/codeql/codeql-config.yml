name: CodeQL config

# Ревизии Alembic — декларативный формат, а не код: `revision`, `down_revision`,
# `branch_labels` и `depends_on` Alembic читает у модуля по именам, поэтому
# py/unused-global-variable из набора security-and-quality помечает все четыре
# в каждом новом файле миграции. Четыре ложных срабатывания на миграцию тонут
# в ревью и приучают пролистывать вкладку безопасности не глядя.
paths-ignore:
  - migrations/alembic/versions
